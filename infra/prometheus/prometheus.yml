global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: spring
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - discovery-service:8761
          - api-gateway:8080
          - auth-service:8081
          - user-service:8082
          - music-service:8083

